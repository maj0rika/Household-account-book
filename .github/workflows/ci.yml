name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: "1"
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/household_ci
  BETTER_AUTH_SECRET: ci-dummy-better-auth-secret-0123456789abcdef0123456789abcdef
  BETTER_AUTH_URL: http://127.0.0.1:3105
  NEXT_PUBLIC_BETTER_AUTH_URL: http://127.0.0.1:3105
  ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

jobs:
  quality-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Governance check
        run: npm run check:governance

      - name: Unit & PGlite DB tests
        run: npm test

      - name: Verify PGlite SQL migrations apply
        run: npx vitest run src/server/db/__tests__/migrations.pglite.test.ts

      - name: Production build
        run: npm run build

  playwright-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Production build
        run: npm run build

      - name: Run Playwright smoke tests
        run: npm run test:e2e:smoke
