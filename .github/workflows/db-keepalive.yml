name: db-keepalive

# Supabase 무료 플랜은 7일쯤 DB 요청이 적으면 프로젝트를 일시중지한다.
# 공개 데모 계정으로 로그인해 실제 DB 조회를 일으키고, 로그인이 안 되면 실패로 알린다.
on:
  schedule:
    - cron: "23 1,13 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      APP_URL: https://household-account-book-tawny.vercel.app
    steps:
      - name: 데모 계정 로그인
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
            -X POST "$APP_URL/api/auth/sign-in/email" \
            -H 'Content-Type: application/json' \
            -H "Origin: $APP_URL" \
            -d '{"email":"demo@example.com","password":"demo2026!"}')
          echo "status=$code"
          test "$code" = "200"
